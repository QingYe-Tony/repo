name: Build Repo

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build_repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dpkg‑dev zstd
        run: |
          sudo apt-get update --yes
          sudo apt-get install --yes dpkg-dev zstd
          hash -r

      - name: Generate Packages multi‑version
        run: |
          set +e
          if [ ! -d "debs" ];then mkdir debs; fi
          ls -la debs/
          dpkg-scanpackages -m debs /dev/null > Packages
          set -e

      - name: Compress Packages
        run: gzip -k -f Packages

      - name: Build Release file
        run: |
          apt-ftparchive release . > Release.tmp
          printf "Architectures: iphoneos-arm64 iphoneos-arm64e\n" > Release
          cat Release.tmp >> Release
          rm -f Release.tmp
          printf "Depiction: https://qingye-tony.github.io/repo/index.html\n" >> Release

      - name: Commit & Push index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Packages Packages.gz Release
          git commit -m "Auto build repo index" || true
          git push origin master
