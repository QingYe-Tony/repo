name: Build Cydia Repo
on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Generate Packages
        run: dpkg-scanpackages -m debs /dev/null > Packages

      - name: Compress index
        run: gzip -k -f Packages && bzip2 -k -f Packages

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Packages.bz2
          git commit -m "Auto update repo index" || echo "No changes to commit"
          git push
