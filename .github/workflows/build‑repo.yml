name: Build Cydia Repo
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'debs/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dpkg‑dev
        run: sudo apt update && sudo apt install -y dpkg-dev apt-utils

      - name: Generate Packages multi‑version
        run: dpkg‑scanpackages -m debs /dev/null > Packages

      - name: Compress Packages
        run: gzip -k -f Packages

      - name: Generate Release
        run: apt‑ftparchive release . > Release

      - name: Commit & push index files
        run: |
          git config user.name "github‑actions[bot]"
          git config user.email "github‑actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Release
          git commit -m "Auto update repo index" || true
          git push
