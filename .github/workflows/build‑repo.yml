name: Build Cydia Repo
on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg‑dev
        run: sudo apt‑get update && sudo apt‑get install -y dpkg‑dev

      - name: Generate Packages（原生支持zstd、iphoneos‑arm64e）
        run: dpkg‑scanpackages -m debs /dev/null > Packages

      - name: Compress index
        run: gzip -k -f Packages && bzip2 -k -f Packages

      - name: Commit & push index files
        run: |
          git config --global user.name "github‑actions"
          git config --global user.email "actions@github.com"
          git add Packages Packages.gz Packages.bz2
          git commit -m "auto update repo index" || true
          git push
