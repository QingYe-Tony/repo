name: Build Cydia Repo
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Generate Packages
        run: dpkg-scanpackages -m debs /dev/null > Packages

      - name: Compress
        run: gzip -k -f Packages

      - name: Generate Release
        run: |
          echo "Origin: 清野" > Release
          echo "Label: 清野源" >> Release
          echo "Suite: stable" >> Release
          echo "Codename: ios" >> Release
          echo "Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e" >> Release
          echo "Components: main" >> Release
          echo "Description: 清野个人越狱插件源" >> Release

      - name: Prepare publish folder
        run: |
          mkdir -p _site
          cp -r debs _site/
          cp Packages Packages.gz Release _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
