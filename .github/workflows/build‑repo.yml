name: Build Cydia Repo
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zstd

      - name: Fix RootHide zstd deb
        run: |
          for deb in debs/*.deb; do
            tmp=$(mktemp -d)
            cd $tmp
            ar x $deb
            if [ -f control.tar.zst ]; then
              zstd -d control.tar.zst
              xz -z control.tar
              ar r $deb debian-binary control.tar.xz data.tar.*
            fi
            cd -
            rm -rf $tmp
          done

      - name: Generate multi-version Packages index
        run: dpkg-scanpackages -m debs /dev/null > Packages

      - name: Compress index
        run: gzip -k -f Packages

      - name: Generate Release
        run: |
          cat > Release <<EOF
Origin: 清野
Label: 清野源
Suite: stable
Codename: ios
Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
Components: main
Description: 清野个人越狱插件源
EOF

      - name: Commit index files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Release
          git commit -m "Auto update repo index" || true
          git push
