name: Build Repo
on:
  push:
    branches: [ master ]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install apt-utils dpkg-dev
        run: |
          apt-get update
          apt-get install -y dpkg-dev apt-utils

      - name: Scan all deb packages
        run: dpkg-scanpackages -m debs /dev/null > Packages

      - name: Compress Packages
        run: gzip -k -f Packages

      - name: Generate full Release file
        run: apt-ftparchive release . > Release

      - name: Append Depiction link
        run: |
          echo 'Depiction: https://qingye-tony.github.io/repo/index.html' >> Release

      - name: Commit & push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Release
          git commit -m "build repo" || true
          git push
