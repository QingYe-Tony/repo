name: Build Cydia Repo
on:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: list debs folder
        run: ls -la debs

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Generate Packages index
        run: dpkg-scanpackages -m debs /dev/null > Packages

      - name: show Packages file head
        run: head -50 Packages

      - name: Compress index files
        run: gzip -k -f Packages && bzip2 -k -f Packages

      - name: list index files
        run: ls -la Packages*

      - name: Upload index as artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-index-files
          path: |
            Packages
            Packages.gz
            Packages.bz2
