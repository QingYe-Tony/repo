name: Build Repo

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build_repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq dpkg-dev zstd

      - name: Generate Packages (-m 保留多版本)
        run: dpkg-scanpackages -m debs /dev/null > Packages

      - name: Compress Packages
        run: gzip -k -f Packages

      - name: Build Release,注入Architectures字段
        run: |
          apt-ftparchive release . > Release.tmp
          printf "Architectures: iphoneos-arm64 iphoneos-arm64e\n" > Release
          cat Release.tmp >> Release
          rm -f Release.tmp
          printf "Depiction: https://qingye-tony.github.io/repo/index.html\n" >> Release

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Packages Packages.gz Release
          git commit -m "Auto update repo index" || true
          git push origin master
