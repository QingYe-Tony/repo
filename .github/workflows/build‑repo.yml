name: Build Repo
on:
  push:
    branches: [ master ]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq dpkg-dev apt-utils zstd

      - name: Scan debs
        run: dpkg-scanpackages -m debs /dev/null > Packages

      - name: Compress Packages
        run: gzip -k -f Packages

      - name: Generate Release
        run: apt-ftparchive release . > Release

      - name: Append Depiction
        run: |
          echo 'Depiction: https://qingye-tony.github.io/repo/index.html' >> Release

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Release
          git commit -m "build repo" || true
          git push
