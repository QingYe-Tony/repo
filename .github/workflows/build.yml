name: Build Repo
on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dpkg-dev
        run: apt-get update && apt-get install -y dpkg-dev

      - name: Generate Packages with ALL versions (-m)
        run: dpkg-scanpackages -m debs /dev/null > Packages

      - name: Compress Packages
        run: gzip -k -f Packages

      - name: Generate Release
        run: |
          cat > Release <<'EOF'
Origin: MyRepo
Label: My Cydia Repo
Suite: stable
Codename: ios
Architectures: iphoneos-arm64
Components: main
Description: My custom repo
EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Packages Packages.gz Release
          git commit -m "auto build repo index" || true
          git push
