name: Build Cydia Repo
on:
  push:
    branches: [ master ]

jobs:
  build_repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dpkg‑dev
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build Packages index
        run: |
          dpkg-scanpackages -m ./debs /dev/null > Packages
          gzip -k9 Packages
          bzip2 -k9 Packages

      - name: Generate Release file
        run: |
          cat > Release <<'EOF'
Origin: 清野
Label: 清野
Suite: stable
Codename: ios
Architectures: iphoneos‑arm64
Components: main
Description: 清野越狱源｜包含有根、无根、隐根(RootHide)插件
EOF
          echo "MD5Sum:" >> Release
          for fn in Packages Packages.gz Packages.bz2;do
              echo " $(md5sum $fn | awk '{print $1}') $(stat --printf=%s $fn) $fn" >> Release
          done
          echo "SHA256Sum:" >> Release
          for fn in Packages Packages.gz Packages.bz2;do
              echo " $(sha256sum $fn | awk '{print $1}') $(stat --printf=%s $fn) $fn" >> Release
          done

      - name: Commit generated repo files
        run: |
          git config user.name "repo‑bot"
          git config user.email "bot@example.local"
          git add Packages Packages.gz Packages.bz2 Release
          git commit -m "Auto build repo index" || true
          git push
