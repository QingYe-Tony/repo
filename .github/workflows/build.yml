name: Auto Build Cydia Repo
on:
  push:
    branches: [ master ]

jobs:
  build_repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dpkg-dev
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev bzip2 gzip

      - name: Generate Packages index
        run: |
          dpkg-scanpackages debs /dev/null > Packages
          bzip2 -k -f Packages
          gzip -k -f Packages

      - name: Commit changed index files
        run: |
          git config --global user.name "Repo‑AutoBuilder"
          git config --global user.email "bot@github.com"
          git add Packages Packages.bz2 Packages.gz
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto update source index" ; git push)
