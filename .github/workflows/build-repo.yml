name: Build Cydia Repo
on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Generate Packages keep all versions
        run: dpkg-scanpackages -m debs /dev/null > Packages

      - name: Compress Packages
        run: gzip -k -f Packages

      - name: Build valid Release for Sileo
        run: |
          rm -f Release
          echo "Origin: 清野源" > Release
          echo "Label: 清野源" >> Release
          echo "Suite: stable" >> Release
          echo "Version: 1.0" >> Release
          echo "Codename: ios" >> Release
          echo "Architectures: iphoneos-arm64 iphoneos-arm64e" >> Release
          echo "Components: main" >> Release
          echo "Description: 清野个人越狱源" >> Release

          echo "MD5Sum:" >> Release
          printf ' %32s %8d Packages\n' $(md5sum Packages | awk '{print $1}') $(stat -c%s Packages) >> Release
          printf ' %32s %8d Packages.gz\n' $(md5sum Packages.gz | awk '{print $1}') $(stat -c%s Packages.gz) >> Release

          echo "SHA256Sum:" >> Release
          printf ' %64s %8d Packages\n' $(sha256sum Packages | awk '{print $1}') $(stat -c%s Packages) >> Release
          printf ' %64s %8d Packages.gz\n' $(sha256sum Packages.gz | awk '{print $1}') $(stat -c%s Packages.gz) >> Release

          echo "SHA512Sum:" >> Release
          printf ' %128s %8d Packages\n' $(sha512sum Packages | awk '{print $1}') $(stat -c%s Packages) >> Release
          printf ' %128s %8d Packages.gz\n' $(sha512sum Packages.gz | awk '{print $1}') $(stat -c%s Packages.gz) >> Release

          echo 'Depiction: https://qingye-tony.github.io/repo/index.html' >> Release

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Release
          git commit -m "Auto update index" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push commit
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
