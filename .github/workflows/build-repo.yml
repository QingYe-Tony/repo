name: Build Cydia Repo
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dpkg
        run: sudo apt-get update && sudo apt-get install -y dpkg

      - name: Generate Packages index
        run: dpkg-scanpackages debs /dev/null > Packages

      - name: Compress index
        run: |
          gzip -k -f Packages
          zstd -k -f Packages

      - name: Commit & Push generated files
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Packages.zst
          git commit -m "Auto update repo index" || echo "No changes to commit"
          git push
