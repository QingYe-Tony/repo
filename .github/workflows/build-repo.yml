name: Build Cydia Repo
on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg‑dev
        run: sudo apt‑get update && sudo apt‑get install -y dpkg‑dev

      - name: Generate Packages（保留全部版本 -m）
        run: dpkg‑scanpackages -m debs /dev/null > Packages

      - name: Compress Packages
        run: gzip -k -f Packages

      - name: Generate Release
        run: |
          apt‑ftparchive release . > Release
          echo 'Depiction: https://qingye‑tony.github.io/repo/index.html' >> Release
          sed -i '$ d' Release

      - name: Commit & Push index files
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Release
          git commit -m "Auto update repo index" || true
          git push
