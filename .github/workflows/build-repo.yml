name: Build Cydia Repo
on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Generate Packages keep all versions
        run: dpkg-scanpackages -m debs /dev/null > Packages

      - name: Compress Packages
        run: gzip -k -f Packages

      - name: Build valid Release for Sileo
        run: |
          cat > Release <<'EOF'
Origin: 清野源
Label: 清野源
Suite: stable
Version: 1.0
Codename: ios
Architectures: iphoneos-arm64 iphoneos-arm64e
Components: main
Description: 清野个人越狱源
EOF
          echo "MD5Sum:" >> Release
          printf ' %32s %8d Packages\n' $(md5sum Packages | awk '{print $1}') $(stat -c%s Packages) >> Release
          printf ' %32s %8d Packages.gz\n' $(md5sum Packages.gz | awk '{print $1}') $(stat -c%s Packages.gz) >> Release

          echo "SHA256Sum:" >> Release
          printf ' %64s %8d Packages\n' $(sha256sum Packages | awk '{print $1}') $(stat -c%s Packages) >> Release
          printf ' %64s %8d Packages.gz\n' $(sha256sum Packages.gz | awk '{print $1}') $(stat -c%s Packages.gz) >> Release

          echo 'Depiction: https://qingye-tony.github.io/repo/index.html' >> Release

      - name: Commit push index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Release
          git commit -m "Auto update index" || true
          git push
