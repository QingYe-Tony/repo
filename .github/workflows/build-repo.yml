name: Build Cydia Repo
on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg‑dev
        run: sudo apt‑get update && sudo apt‑get install -y dpkg‑dev

      - name: Generate multi‑version Packages
        run: dpkg‑scanpackages -m debs /dev/null > Packages

      - name: Compress index files
        run: |
          gzip -k -f Packages
          bzip2 -k -f Packages

      - name: Generate Release
        run: |
          cat > Release <<EOF
Origin: QingYe
Label: QingYe
Suite: stable
Codename: ios
Architectures: iphoneos‑arm64 iphoneos‑arm64e
Components: main
Description: QingYe Personal Repo
EOF

      - name: Commit & push index
        run: |
          git config --global user.name "GitHub‑Actions"
          git config --global user.email "actions@github.com"
          git add Packages Packages.gz Packages.bz2 Release
          git commit -m "Auto rebuild index + Release" || true
          git push
